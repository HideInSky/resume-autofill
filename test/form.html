<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>填表引擎测试页</title>
<style>
  body { font: 14px/1.6 sans-serif; max-width: 760px; margin: 20px auto; }
  fieldset { margin: 12px 0; } .form-item { margin: 6px 0; } label, .label { display: inline-block; min-width: 130px; }
  #out { white-space: pre-wrap; background: #f3f3f3; padding: 10px; }
</style>
</head>
<body>
<h1>填表引擎测试页（虚构数据）</h1>
<p>直接用浏览器打开本页会自动运行自检；装好扩展后也可以在这里试「一键填写」。</p>
<pre id="out">运行中…</pre>

<h2>中文网申风格</h2>
<div class="form-item"><label for="c1">姓名 *</label><input id="c1"></div>
<div class="form-item"><span class="label">性别</span>
  <label><input type="radio" name="sex" value="1">男</label>
  <label><input type="radio" name="sex" value="2">女</label></div>
<div class="form-item"><span class="label">出生日期</span><input id="c3" placeholder="yyyy/mm/dd"></div>
<div class="form-item"><span class="label">手机号码</span><input id="c4" type="tel"></div>
<div class="form-item"><span class="label">电子邮箱</span><input id="c5"></div>
<div class="form-item"><span class="label">政治面貌</span>
  <select id="c6"><option value="">请选择</option><option value="a">群众</option><option value="b">共青团员</option><option value="c">中共党员</option></select></div>
<div class="form-item"><span class="label">现居住城市</span><input id="c7"></div>
<div class="form-item"><span class="label">应聘职位</span><input id="c8"></div>
<div class="form-item"><span class="label">紧急联系人电话</span><input id="c9"></div>
<div class="form-item"><span class="label">期望行业</span><input id="c10"></div>
<div class="form-item"><span class="label">微信号</span><input id="c11" value="已有内容"></div>

<h3>教育经历</h3>
<div class="edu">
  <div class="form-item"><span class="label">学校名称</span><input id="e1"></div>
  <div class="form-item"><span class="label">学校所在城市</span><input id="e1c"></div>
  <div class="form-item"><span class="label">学历</span>
    <select id="e2"><option value="">请选择</option><option value="1">博士研究生</option><option value="2">硕士研究生</option><option value="3">大学本科</option></select></div>
  <div class="form-item"><span class="label">专业</span><input id="e3"></div>
  <div class="form-item"><span class="label">开始时间</span><input id="e4" type="month"></div>
  <div class="form-item"><span class="label">结束时间</span><input id="e5" type="date"></div>
</div>
<div class="edu">
  <div class="form-item"><span class="label">学校名称</span><input id="e6"></div>
  <div class="form-item"><span class="label">学历</span>
    <select id="e7"><option value="">请选择</option><option value="1">博士研究生</option><option value="2">硕士研究生</option><option value="3">大学本科</option></select></div>
  <div class="form-item"><span class="label">专业</span><input id="e8"></div>
  <div class="form-item"><span class="label">是否全日制</span>
    <select id="e9"><option value="">请选择是否全日制</option><option value="1">全日制</option><option value="2">非全日制</option></select></div>
</div>

<h3>实习经历</h3>
<table>
  <tr><th>公司名称</th><td><input id="w1"></td></tr>
  <tr><th>公司规模</th><td><input id="w1s"></td></tr>
  <tr><th>职位名称</th><td><input id="w2"></td></tr>
  <tr><th>开始时间</th><td><input id="w3" placeholder="YYYY.MM"></td></tr>
  <tr><th>工作内容</th><td><textarea id="w4"></textarea></td></tr>
</table>
<h3>语言能力</h3>
<div class="form-item"><span class="label">语言类型</span>
  <select id="l1"><option value="">请选择语言类型</option><option value="ja">日语</option><option value="en">英语</option></select></div>

<h2>English ATS style</h2>
<div><input id="g1" name="first_name" aria-label="First Name"></div>
<div><input id="g2" name="lastName" placeholder="Last Name"></div>
<div><label for="g3">Email Address</label><input id="g3" type="email"></div>
<div><label for="g4">Phone</label><input id="g4" autocomplete="tel"></div>
<div><label for="g5">LinkedIn Profile</label><input id="g5"></div>
<fieldset><legend>Gender</legend>
  <label><input type="radio" name="g_gender" value="m"> Male</label>
  <label><input type="radio" name="g_gender" value="f"> Female</label>
  <label><input type="radio" name="g_gender" value="x"> Decline to self-identify</label></fieldset>
<div><label for="g7">Will you now or in the future require sponsorship?</label>
  <select id="g7"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
<div><label for="g8">Degree</label>
  <select id="g8" name="education[2][degree]"><option value="">Select</option><option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctorate</option></select></div>
<div><label for="g9">Username</label><input id="g9"></div>
<div><label for="g10">Password</label><input id="g10" type="password"></div>
<div><input id="g11" type="search" placeholder="Search jobs"></div>
<div><label for="g12">Cover letter / About you</label><textarea id="g12"></textarea></div>

<script src="../src/schema.js"></script>
<script src="../src/filler.js"></script>
<script type="module">
const SAMPLE = {
  basic: { name: '张三', firstName: 'San', lastName: 'Zhang', gender: '女', birthday: '2001-03-15', phone: '13800000000',
           email: 'zhangsan@example.com', political: '共青团员', city: '上海', wechat: 'zs_wx', linkedin: 'https://linkedin.com/in/example' },
  account: { username: 'zhangsan01', password: 'Test-Only-123' },
  intent: { position: '数据分析师' },
  education: [
    { school: '示例大学', degree: '硕士', major: '统计学', start: '2023-09', end: '2025-06', city: '北京' },
    { school: '样例学院', degree: '本科', major: '数学' },
  ],
  work: [{ company: '示例科技', title: '数据分析实习生', start: '2024-06', description: '负责报表与归因分析' }],
  other: { selfIntro: 'Hello, this is a sample.' },
  custom: [{ keywords: '期望行业, industry', value: '互联网' }],
};
const v = (id) => document.getElementById(id).value;
const radio = (name) => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;
const report = await __resumeAutofill(SAMPLE, {}, { fillPassword: false });
const report2 = await __resumeAutofill(SAMPLE, {}, { fillPassword: true }); // 第二次运行：只应补上密码
const EXPECT = [
  ['姓名', v('c1'), '张三'], ['性别(radio)', radio('sex'), '2'], ['出生日期', v('c3'), '2001/03/15'],
  ['手机', v('c4'), '13800000000'], ['邮箱', v('c5'), 'zhangsan@example.com'], ['政治面貌', v('c6'), 'b'],
  ['现居城市', v('c7'), '上海'], ['应聘职位', v('c8'), '数据分析师'], ['紧急联系人(不填)', v('c9'), ''],
  ['自定义:期望行业', v('c10'), '互联网'], ['已有内容不覆盖', v('c11'), '已有内容'],
  ['学校1', v('e1'), '示例大学'], ['学校1城市', v('e1c'), '北京'], ['学历1', v('e2'), '2'], ['专业1', v('e3'), '统计学'],
  ['开始(month)', v('e4'), '2023-09'], ['结束(date)', v('e5'), '2025-06-01'],
  ['学校2', v('e6'), '样例学院'], ['学历2', v('e7'), '3'], ['专业2', v('e8'), '数学'], ['语言类型(默认英语)', v('l1'), 'en'], ['是否全日制(默认全日制)', v('e9'), '1'],
  ['公司', v('w1'), '示例科技'], ['公司规模(不填)', v('w1s'), ''], ['职位', v('w2'), '数据分析实习生'],
  ['开始(YYYY.MM)', v('w3'), '2024.06'], ['工作内容', v('w4'), '负责报表与归因分析'],
  ['First name', v('g1'), 'San'], ['Last name', v('g2'), 'Zhang'], ['Email', v('g3'), 'zhangsan@example.com'],
  ['Phone', v('g4'), '13800000000'], ['LinkedIn', v('g5'), 'https://linkedin.com/in/example'],
  ['Gender(radio)', radio('g_gender'), 'f'], ['Sponsorship(无此字段,不填)', v('g7'), ''], ['Degree(无第3段→不填)', v('g8'), ''],
  ['Username', v('g9'), 'zhangsan01'], ['Password(第二次才填)', v('g10'), 'Test-Only-123'],
  ['搜索框(不填)', v('g11'), ''], ['About you', v('g12'), 'Hello, this is a sample.'],
  ['第一次运行未填密码', String(report.filled.includes('网申账号 · 密码')), 'false'],
  ['第二次运行只填 1 项', String(report2.filled.length), '1'],
];
const fails = EXPECT.filter(([, got, want]) => got !== want);
document.getElementById('out').textContent =
  `${EXPECT.length - fails.length}/${EXPECT.length} 通过\n` +
  fails.map(([n, got, want]) => `✗ ${n}: 得到「${got}」，期望「${want}」`).join('\n') +
  `\n\nreport: ${JSON.stringify(report)}`;
</script>
</body>
</html>
