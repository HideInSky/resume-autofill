<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ant Design v3 日期测试页</title>
<style>
  body { font: 14px/1.6 sans-serif; max-width: 820px; margin: 20px auto; }
  .ant-form-item { display: flex; gap: 10px; margin: 6px 0; align-items: center; }
  .ant-form-item-label { width: 120px; flex: none; }
  .ant-calendar-picker-container { position: absolute; background: #fff; border: 1px solid #999; padding: 6px; z-index: 9; }
  .ant-calendar-month-panel-cell { padding: 2px 8px; cursor: pointer; }
  #out { white-space: pre-wrap; background: #f3f3f3; padding: 10px; }
</style>
</head>
<body>
<h1>Ant Design v3 日期测试页（虚构数据）</h1>
<p>仿照 B 站网申：点开的框是只读的；日期面板里另有一个输入框；月份面板没有输入框，只能翻年份、点「一月」到「十二月」。直接打开本页会自动运行自检。</p>
<pre id="out">运行中…</pre>
<div id="app"></div>

<script src="../src/schema.js"></script>
<script src="../src/filler.js"></script>
<script type="module">
const h = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); kids.forEach((k) => n.append(k)); return n; };
const refs = {};
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
let openPop = null;
const close = () => { if (openPop) openPop.remove(); openPop = null; };
document.addEventListener('mousedown', (e) => { if (openPop && !openPop.contains(e.target) && !e.target.closest('.ant-calendar-picker')) close(); });

function trigger(id, mode, onOpen) {
  const input = h('input', { className: 'ant-calendar-picker-input ant-input', readOnly: true, placeholder: '请选择日期' });
  refs[id] = input;
  // 和真实组件一样：值只认面板里选出来的，直接往只读框里写会被改回去
  const commit = (v) => { input.dataset.v = v; input.value = v; };
  input.commit = commit;
  input.addEventListener('input', () => { input.value = input.dataset.v || ''; });
  input.addEventListener('change', () => { input.value = input.dataset.v || ''; });
  const span = h('span', { className: 'ant-calendar-picker' }, [h('div', {}, [input])]);
  if (mode) span.setAttribute('mode', mode);
  input.addEventListener('click', () => { close(); openPop = onOpen(input); const r = input.getBoundingClientRect(); openPop.style.left = r.left + 'px'; openPop.style.top = r.bottom + scrollY + 'px'; document.body.append(openPop); });
  return span;
}
// 月份：表头是年份和前后一年的按钮，表格里是「一月」…「十二月」
function monthPicker(id) {
  return trigger(id, 'month', (input) => {
    let year = 2026;
    const label = h('span', { className: 'ant-calendar-month-panel-year-select-content', textContent: String(year) });
    const step = (d) => { year += d; label.textContent = String(year); };
    const prev = h('a', { className: 'ant-calendar-month-panel-prev-year-btn' }); prev.addEventListener('click', () => step(-1));
    const next = h('a', { className: 'ant-calendar-month-panel-next-year-btn' }); next.addEventListener('click', () => step(1));
    const cells = CN.map((c, i) => {
      const td = h('td', { className: 'ant-calendar-month-panel-cell', title: `${c}月` }, [h('a', { className: 'ant-calendar-month-panel-month', textContent: `${c}月` })]);
      td.addEventListener('click', () => { input.commit(`${year}-${String(i + 1).padStart(2, '0')}`); close(); });
      return td;
    });
    const rows = [0, 1, 2, 3].map((r) => h('tr', {}, cells.slice(r * 3, r * 3 + 3)));
    return h('div', { className: 'ant-calendar-picker-container' }, [h('div', { className: 'ant-calendar ant-calendar-month-calendar' }, [
      h('div', { className: 'ant-calendar-month-panel' }, [
        h('div', { className: 'ant-calendar-month-panel-header' }, [prev, h('a', { className: 'ant-calendar-month-panel-year-select' }, [label]), next]),
        h('table', { className: 'ant-calendar-month-panel-table' }, [h('tbody', {}, rows)]),
      ]),
    ])]);
  });
}
// 日期：面板顶上有一个可以输入的框，回车确认
function datePicker(id) {
  return trigger(id, '', (input) => {
    const box = h('input', { className: 'ant-calendar-input', placeholder: '请选择' });
    box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && /^\d{4}-\d{2}-\d{2}$/.test(box.value)) { input.commit(box.value); close(); } });
    const tds = Array.from({ length: 28 }, (_, i) => h('td', { title: `2026年11月${i + 1}日`, textContent: String(i + 1) }));
    return h('div', { className: 'ant-calendar-picker-container' }, [h('div', { className: 'ant-calendar' }, [
      h('div', { className: 'ant-calendar-input-wrap' }, [box]),
      h('table', { className: 'ant-calendar-table' }, [h('tbody', {}, [h('tr', {}, tds)])]),
    ])]);
  });
}
const row = (label, ...kids) => h('div', { className: 'ant-row ant-form-item' }, [
  h('div', { className: 'ant-form-item-label' }, [h('label', { className: 'ant-form-item-required', textContent: label })]),
  h('div', { className: 'ant-form-item-control-wrapper' }, [h('div', { className: 'ant-form-item-control' }, [h('div', { className: 'bili-date' }, kids)])]),
]);

document.getElementById('app').append(
  h('h3', { textContent: '基本信息' }),
  row('出生日期', datePicker('birth')),
  h('h3', { textContent: '教育经历' }),
  row('学校名称', h('input', { className: 'ant-input', id: 'school' })),
  row('起止时间', monthPicker('start'), h('span', { className: 'to', textContent: '至' }), monthPicker('end')),
);

const SAMPLE = { basic: { birthday: '2001-03-15' }, education: [{ school: '示例大学', start: '2019-09', end: '2023-06' }] };
await __resumeAutofill(SAMPLE, {}, {});
const EXPECT = [
  ['出生日期(面板里的输入框)', refs.birth.value, '2001-03-15'],
  ['入学(月份面板,往前翻年)', refs.start.value, '2019-09'],
  ['毕业(月份面板)', refs.end.value, '2023-06'],
];
const fails = EXPECT.filter(([, got, want]) => got !== want);
document.getElementById('out').textContent =
  `${EXPECT.length - fails.length}/${EXPECT.length} 通过\n` + fails.map(([n, got, want]) => `✗ ${n}: 得到「${got}」，期望「${want}」`).join('\n');
</script>
</body>
</html>
