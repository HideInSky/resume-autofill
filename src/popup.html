<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>简历自动填</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header class="pop-head">
    <h1>简历自动填</h1>
    <span id="prof-chip" class="pill" title="当前用的这套资料" hidden></span>
  </header>

  <form id="locked" class="stack" hidden>
    <span class="muted">这份资料以前设置过加密，输入当时的密码解锁。</span>
    <input id="pw" type="password" placeholder="当时设置的密码" autocomplete="off">
    <button class="primary">解锁</button>
    <span id="pw-msg" class="err"></span>
  </form>

  <div id="empty" class="stack" hidden>
    <span class="muted">还没有资料。先花几分钟填好，之后就能一键填表。</span>
    <button id="setup" class="primary">去填写我的资料</button>
  </div>

  <div id="ready" class="stack" hidden>
    <div id="prof-row" class="field" hidden>
      <span>这个页面用哪套资料</span>
      <div class="pw"><select id="prof-pick"></select><button id="prof-default" type="button">设为默认</button></div>
    </div>
    <button id="fill" class="primary">填写当前页面</button>
    <div class="opts">
      <label class="check"><input id="opt-auto" type="checkbox"> 打开网页时自动填写</label>
      <label class="check"><input id="opt-password" type="checkbox" checked> 填写密码框</label>
      <label class="check"><input id="opt-save" type="checkbox"> 填完后点「保存」</label>
      <label class="check"><input id="opt-overwrite" type="checkbox"> 覆盖已有内容</label>
    </div>
    <div id="result" class="muted"></div>
    <details>
      <summary id="copy-title">没填上？点击复制</summary>
      <div id="copy" class="copy-list"></div>
    </details>
  </div>

  <div class="foot">
    <button id="edit" class="link">编辑资料</button>
    <button id="lock" class="link" hidden>锁定</button>
  </div>

  <script src="schema.js"></script>
  <script src="vault.js"></script>
  <script src="run.js"></script>
  <script src="popup.js"></script>
</body>
</html>
