<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投递记录 · 简历自动填</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="tracker">
  <div class="t-page">
    <header class="t-head">
      <div>
        <h1>投递记录</h1>
        <p class="muted">填过的网申页面会自动记在这里；你在页面上点了「投递 / 提交」，状态会变成「已投递」。之后的进展自己改。</p>
      </div>
      <button id="add" class="primary">＋ 添加一条</button>
    </header>

    <div class="t-file" id="file-bar">
      <span id="file-state" class="muted"></span>
      <button id="file-link">连接本地 CSV 文件</button>
      <button id="file-new" class="link">新建一个</button>
      <button id="file-unlink" class="link danger" hidden>断开</button>
    </div>

    <div class="t-tools">
      <div class="seg" id="filters" role="tablist" aria-label="按状态筛选"></div>
      <input id="search" type="search" placeholder="搜索公司、职位、城市" aria-label="搜索">
    </div>
    <p id="stats" class="muted"></p>

    <div class="t-wrap">
      <table class="t-table">
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="t-empty" hidden>
        <b>还没有投递记录</b>
        <span class="muted">打开网申页面填写后会自动出现在这里，也可以点「添加一条」手动记。</span>
      </div>
    </div>

    <div class="row">
      <button id="import">导入 CSV</button>
      <input id="import-file" type="file" accept=".csv,text/csv" hidden>
      <button id="export">导出 CSV</button>
      <span class="muted">Excel 里另存为「CSV UTF-8」就能导入。</span>
    </div>
  </div>
  <div id="status" role="status" hidden></div>

  <script src="apps.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
